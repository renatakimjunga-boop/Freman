<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Freman — offline</title>
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100vh;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
        color: #fafafa;
        font-family:
          ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        max-width: 26rem;
        padding: 3rem 1.5rem;
        text-align: center;
      }
      img {
        width: 6rem;
        height: 6rem;
        border-radius: 1rem;
        display: block;
        margin: 0 auto 2rem;
      }
      h1 {
        font-size: 1.25rem;
        font-weight: 600;
        letter-spacing: -0.01em;
        margin: 0;
      }
      .code {
        margin-top: 0.75rem;
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        font-size: 0.6875rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: #a1a1aa;
      }
      p {
        margin: 1rem auto 0;
        max-width: 20rem;
        font-size: 0.875rem;
        line-height: 1.5;
        color: #a1a1aa;
      }
      a {
        display: inline-block;
        margin-top: 2rem;
        border: 1px solid #27272a;
        border-radius: 9999px;
        padding: 0.5rem 1.5rem;
        font-size: 0.875rem;
        color: #fafafa;
        text-decoration: none;
        transition: border-color 150ms ease;
      }
      a:hover {
        border-color: #52525b;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="Freman Browser" />
      <h1>You're offline</h1>
      <p class="code">Freman Browser</p>
      <p>
        Freman couldn't load this page. Check your connection — your tabs,
        bookmarks and wallet data are stored in your Convex account and will
        sync when you're back online.
      </p>
      <a href="/">Retry Freman</a>
    </main>
  </body>
</html>
